<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Ping Pong Game</title>
<style>
  * {
	box-sizing: border-box;
}

body, html {
	height: 100%;
	width: 100%;
	font-family: 'Segoe UI', sans-serif;
	background: radial-gradient(circle at center, #0f0c29, #302b63, #24243e);
	color: white;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	text-align: center;
	overflow: hidden;
}

.container {
  margin-top: 80px;
	background-color: #1e1e1e;
	padding: 40px 30px;
	border-radius: 20px;
	box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
	width: 90%;
	max-width: 420px;
	margin-bottom: 20px;
}

#ping_pong_game {
	font-size: 2.8rem;
	font-weight: bold;
	color: #ffeb3b;
	text-transform: uppercase;
	letter-spacing: 3px;
	margin-bottom: 30px;
	text-shadow: 0 0 10px #ffeb3b, 0 0 20px #ffeb3b;
	animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
	0% {
		text-shadow: 0 0 10px #ffeb3b, 0 0 20px #ffeb3b;
	}
	100% {
		text-shadow: 0 0 20px #ffc107, 0 0 30px #ffc107;
	}
}

input[type="text"] {
	width: 100%;
	padding: 14px;
	margin: 20px 0;
	border: none;
	border-radius: 25px;
	background-color: rgba(255, 255, 255, 0.1);
	color: white;
	font-size: 1rem;
	text-align: center;
	transition: all 0.3s ease;
}

input::placeholder {
	color: #bbb;
}

button {
	width: 100%;
	padding: 14px;
	border: none;
	border-radius: 25px;
	font-size: 1rem;
	font-weight: bold;
	cursor: pointer;
	transition: all 0.3s ease;
	margin-bottom: 15px;
}

#create-room-button {
	background: linear-gradient(to right, #4facfe, #00f2fe);
	color: white;
}

#join_room_tournament {
	background: linear-gradient(to right, #43e97b, #38f9d7);
	color: white;
}

button:hover {
	transform: scale(1.03);
	filter: brightness(1.1);
}

#game-link {
	display: inline-block;
	background-color: #6a4f09;
	color: #ffc107;
	font-size: 1.1rem;
	font-weight: bold;
	padding: 12px 24px;
	border-radius: 25px;
	text-transform: uppercase;
	letter-spacing: 2px;
	text-shadow: 0 0 5px rgba(255, 193, 7, 0.5);
	text-decoration: none;
	margin-top: 10px;
	transition: all 0.3s ease;
}

#game-link:hover {
	background-color: #9e6d0c;
	transform: scale(1.05);
	color: white;
}

#pongCanvas {
	background: #000;
	border: 4px solid #fff;
	border-radius: 10px;
	box-shadow: 0 0 20px rgba(0, 0, 0, 0.7);
	margin-top: 20px;
}

#retry-id {
	margin-top: 20px;
	display: none;
	flex-direction: column;
	align-items: center;
}

#retry-id h1 {
	color: #4fc3f7;
	font-size: 2rem;
	margin-bottom: 20px;
}

#retry-id button {
	width: 180px;
	background-color: #4fc3f7;
	color: #000;
}
</style>
</head>

<body>
	<div id="join-page" class="container">
        <div class="message mt-3" id="message"></div>
		<h1 id="ping_pong_game">Ping Pong Game</h1>
		<form id="create-room">
			<button id="create-room-button" type="submit">Create Room</button>
		</form>
		<form id="join-room">
			<input type="text" id="roomName" name="room_code" placeholder="Enter Room Code" required>
			<button id="join_room_tournament" type="submit">Join Room</button>
		</form>
	</div>
	<div id="gameCanvas" class="form-group">
		<canvas id="pongCanvas" width="800" height="400"></canvas>
	</div>
	<form id="retry-id">
		<h1 id="winner"></h1>
		<button type="submit">Retry</button>
	</form>

</body>

</html>
