<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ping Pong Tournament</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Base Styles */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body, html {
            height: 100%;
            width: 100%;
            overflow-x: hidden;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Main Title */
        #ping_pong_tournament {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
            margin-bottom: 30px;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        
        #ping_pong_tournament::before {
            content: attr(id);
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            font-size: 120%;
            color: rgba(255, 255, 255, 0.1);
            z-index: -1;
            white-space: nowrap;
            filter: blur(8px);
        }
        
        /* Containers */
        .game-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
            overflow: hidden;
            position: relative;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        
        /* Join Page */
        #join-page {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }
        
        /* Forms */
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }
        
        .input-group {
            position: relative;
            width: 100%;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 15px 20px;
            border: none;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            font-size: 16px;
            font-weight: 500;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(5px);
        }
        
        input[type="text"]::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }
        
        input[type="text"]:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.25);
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }
        
        /* Buttons */
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: all 0.5s ease;
        }
        
        .btn:hover::before {
            left: 100%;
        }
        
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        
        .btn:active {
            transform: translateY(0);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        .btn-primary {
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            color: white;
        }
        
        .btn-success {
            background: linear-gradient(45deg, #11998e, #38ef7d);
            color: white;
        }
        
        .btn-warning {
            background: linear-gradient(45deg, #f7971e, #ffd200);
            color: white;
        }
        
        .btn-lg {
            padding: 18px 36px;
            font-size: 18px;
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Players List */
        .players-container {
            display: none; /* Initially hidden */
            width: 100%;
        }
        
        .players-list {
            list-style: none;
            padding: 0;
            margin: 0 0 20px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .players-list li {
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }
        
        .players-list li:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }
        
        .player-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(45deg, #00c6ff, #0072ff);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }
        
        .player-name {
            font-weight: 600;
            font-size: 16px;
            flex-grow: 1;
        }
        
        .player-status {
            font-size: 12px;
            padding: 5px 10px;
            border-radius: 20px;
            background: rgba(56, 239, 125, 0.2);
            color: #38ef7d;
        }
        
        /* Game Canvas */
        #gameCanvas {
            display: none; /* Initially hidden */
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }
        
        canvas {
            width: 100%;
            height: auto;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: #000;
        }
        
        /* Room Code Display */
        .room-code {
            display: none; /* Initially hidden */
            background: rgba(255, 255, 255, 0.15);
            padding: 15px 20px;
            border-radius: 10px;
            margin-top: 20px;
            text-align: center;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .room-code-label {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        
        .room-code-value {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        
        /* Messages */
        .message {
            padding: 10px 15px;
            border-radius: 10px;
            font-weight: 500;
            text-align: center;
            display: none; /* Initially hidden */
        }
        
        .message.error {
            background: rgba(255, 82, 82, 0.2);
            color: #ff5252;
        }
        
        .message.success {
            background: rgba(56, 239, 125, 0.2);
            color: #38ef7d;
        }
        
        /* Next Game Button */
        #next_game_button {
            display: none; /* Initially hidden */
            margin-top: 20px;
        }
        
        /* Username Display */
        #username {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 10px 0;
            display: none; /* Initially hidden */
        }
        
        /* Tournament Link */
        #tournament-link {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50px;
            margin-top: 20px;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        #tournament-link:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }
        
        /* Responsive Design */
        @media (max-width: 768px) {
            body, html {
                padding: 15px;
            }
            
            #ping_pong_tournament {
                margin-bottom: 20px;
            }
            
            .card {
                padding: 20px;
            }
            
            .btn {
                padding: 12px 24px;
                font-size: 14px;
            }
            
            .btn-lg {
                padding: 15px 30px;
                font-size: 16px;
            }
            
            input[type="text"] {
                padding: 12px 15px;
                font-size: 14px;
            }
            
            .room-code-value {
                font-size: 20px;
            }
        }
        
        @media (max-width: 480px) {
            #ping_pong_tournament {
                font-size: 1.8rem;
            }
            
            .card {
                padding: 15px;
            }
            
            .players-list li {
                padding: 10px 15px;
            }
            
            .player-avatar {
                width: 30px;
                height: 30px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
    <h1 id="ping_pong_tournament">Ping Pong Tournament</h1>
    
    <div class="game-container">
        <!-- Join Page -->
        <div id="join-page" class="card">
            <form id="create-room">
                <button id="create-room-button" type="submit" class="btn btn-primary btn-lg">
                    <i class="fas fa-plus-circle"></i> Create Room
                </button>
            </form>
            
            <div class="room-code">
                <div class="room-code-label">Your Room Code:</div>
                <div class="room-code-value" id="room-code-display">ABC123</div>
                <p>Share this code with friends to join your tournament</p>
            </div>
            
            <form id="join-room">
                <div class="input-group">
                    <input type="text" id="roomName" name="room_code" placeholder="Enter Room Code" required>
                </div>
                <button id="join-room-button" type="submit" class="btn btn-primary">
                    <i class="fas fa-sign-in-alt"></i> Join Room
                </button>
            </form>
            
            <div id="message" class="message"></div>
        </div>
        
        <!-- Players List -->
        <div class="players-container card">
            <h2>Tournament Players</h2>
            <ul class="players-list" id="players-list">
                <!-- Players will be added dynamically -->
                <li>
                    <div class="player-avatar">P1</div>
                    <div class="player-name">Player 1</div>
                    <div class="player-status">Ready</div>
                </li>
                <li>
                    <div class="player-avatar">P2</div>
                    <div class="player-name">Player 2</div>
                    <div class="player-status">Ready</div>
                </li>
            </ul>
            
            <button id="start-game" class="btn btn-success btn-lg" disabled>
                <i class="fas fa-play-circle"></i> Start Tournament
            </button>
        </div>
        
        <!-- Game Canvas -->
        <div id="gameCanvas" class="card">
            <h2 id="username" class="text-center mb-3"></h2>
            <canvas id="pongCanvas" width="800" height="400"></canvas>
            <button id="next_game_button" class="btn btn-warning mt-4">
                <i class="fas fa-forward"></i> Next Game
            </button>
        </div>
        
        <a href="#" id="tournament-link">
            <i class="fas fa-trophy"></i> Tournament Rules
        </a>
    </div>

    <script>
        // This script is for demonstration purposes only
        // It shows/hides elements to demonstrate the UI flow
        
        document.addEventListener('DOMContentLoaded', function() {
            // Get elements
            const createRoomForm = document.getElementById('create-room');
            const roomCodeDisplay = document.querySelector('.room-code');
            const playersContainer = document.querySelector('.players-container');
            const startGameBtn = document.getElementById('start-game');
            const gameCanvas = document.getElementById('gameCanvas');
            const nextGameBtn = document.getElementById('next_game_button');
            
            // Create room
            createRoomForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // Show room code
                roomCodeDisplay.style.display = 'block';
                
                // Show players container
                playersContainer.style.display = 'block';
                
                // Enable start game button after 2 players join (simulated)
                setTimeout(() => {
                    startGameBtn.disabled = false;
                }, 2000);
            });
            
            // Start game
            startGameBtn.addEventListener('click', function() {
                if (!this.disabled) {
                    // Hide join page and players container
                    document.getElementById('join-page').style.display = 'none';
                    playersContainer.style.display = 'none';
                    
                    // Show game canvas
                    gameCanvas.style.display = 'block';
                    
                    // Show next game button after a delay (simulating end of game)
                    setTimeout(() => {
                        nextGameBtn.style.display = 'block';
                    }, 3000);
                }
            });
            
            // Next game
            nextGameBtn.addEventListener('click', function() {
                // Hide next game button
                this.style.display = 'none';
                
                // Show players container for next round
                playersContainer.style.display = 'block';
            });
        });
    </script>
</body>
</html>
