<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Sign Up</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			padding: 0;
			height: 100vh;
			background: radial-gradient(circle at center, #0f0c29, #302b63, #24243e);
			display: flex;
			justify-content: center;
			align-items: center;
			font-family: 'Segoe UI', sans-serif;
		}

		form {
			background-color: #1e1e1e;
			padding: 40px 30px;
			border-radius: 10px;
			width: 320px;
			box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
		}

		form h2 {
			text-align: center;
			color: #4fc3f7;
			font-size: 2rem;
			margin-bottom: 30px;
		}

		.inputBox {
			margin-bottom: 20px;
		}

		.inputBox input {
			width: 100%;
			padding: 14px;
			border: none;
			outline: none;
			background: #2b2b2b;
			border-radius: 6px;
			color: #fff;
			font-size: 1rem;
		}

		.inputBox input::placeholder {
			color: #bbb;
		}

		.inputBox i {
			display: none; /* isteğe göre kaldırılabilir */
		}

		#submit {
			background-color: #4fc3f7;
			color: black;
			font-weight: bold;
			font-size: 1rem;
			cursor: pointer;
			border: none;
			padding: 14px;
			border-radius: 6px;
			width: 100%;
			transition: 0.3s ease;
		}

		#submit:hover {
			background-color: #03a9f4;
		}
	</style>
</head>
<body>

	<form id="registerForm">
		<h2 id="signup_signuppage">SIGN UP</h2>

		<div class="inputBox">
			<input type="text" id="username" placeholder="Nickname" required>
			<i id="username_signup">username</i>
		</div>
		<div class="inputBox">
			<input type="email" id="email" placeholder="E-mail" required>
			<i id="email_signup">email</i>
		</div>
		<div class="inputBox">
			<input type="password" id="password" placeholder="Password" required>
			<i id="password_signup">Password</i>
		</div>

		<div class="inputBox">
			<input type="submit" id="submit" value="Submit">
		</div>
	</form>

</body>
</html>
