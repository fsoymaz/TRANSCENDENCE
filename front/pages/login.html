<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      background: radial-gradient(circle at center, #0f0c29, #302b63, #24243e);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    form {
      background-color: #1e1e1e;
      padding: 40px 30px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
    }

    h2 {
      text-align: center;
      color: #4fc3f7;
      font-size: 2rem;
      margin-bottom: 30px;
    }

    .inputBox {
      margin-bottom: 20px;
    }

    .inputBox input {
      width: 100%;
      padding: 14px;
      border: none;
      outline: none;
      background: #2b2b2b;
      border-radius: 6px;
      color: #fff;
      font-size: 1rem;
    }

    .inputBox input::placeholder {
      color: #bbb;
    }

    .action-buttons {
      display: flex;
      justify-content: space-between;
      margin: 20px 0;
    }

    .action-buttons a {
      text-decoration: none;
      background-color: #4fc3f7;
      color: black;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 500;
      font-size: 1em;
      transition: background-color 0.3s ease;
    }

    .action-buttons a:hover {
      background-color: #03a9f4;
      color: white;
    }

    #submit,
    #login42-link {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      background-color: #4fc3f7;
      border: none;
      border-radius: 6px;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    #submit:hover,
    #login42-link:hover {
      background-color: #03a9f4;
      color: white;
    }
  </style>
</head>
<body>

  <form id="loginForm">
    <h2 id="sign_in_id">SIGN IN</h2>

    <div class="inputBox">
      <input type="text" id="email" placeholder="E-mail" required>
    </div>

    <div class="inputBox">
      <input type="password" id="password" placeholder="Password" required>
    </div>

    <div class="action-buttons">
      <a href="#" id="forget-password">Forget Password</a>
      <a href="#" id="register">Sign Up</a>
    </div>

    <div class="inputBox">
      <input type="submit" id="submit" value="Submit">
    </div>

    <div class="inputBox">
      <input type="button" id="login42-link" value="Login with 42">
    </div>
  </form>

</body>
</html>
