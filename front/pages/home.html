<!DOCTYPE html>
<html lang="tr">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Takımımız</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
	<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600&display=swap" rel="stylesheet">

	<style>
		body, html {
			height: 100%;
			margin: 0;
			font-family: 'Orbitron', sans-serif;
			background: linear-gradient(135deg, #1f1c2c, #928dab);
			display: flex;
			align-items: center;
			justify-content: center;
			color: white;
			overflow: hidden;
		}

		.wrapper {
			text-align: center;
		}

		h1 {
			font-size: 3rem;
			margin-bottom: 30px;
		}

		.name-box {
			font-size: 3rem;
			font-weight: bold;
			min-height: 70px;
			position: relative;
			overflow: hidden;
		}

		.name-text {
			position: absolute;
			width: 100%;
			opacity: 0;
			animation: slideName 10s infinite;
		}

		.name-text:nth-child(1) { animation-delay: 0s; }
		.name-text:nth-child(2) { animation-delay: 2s; }
		.name-text:nth-child(3) { animation-delay: 4s; }
		.name-text:nth-child(4) { animation-delay: 6s; }
		.name-text:nth-child(5) { animation-delay: 8s; }

		@keyframes slideName {
			0% { opacity: 0; transform: translateY(20px); }
			10% { opacity: 1; transform: translateY(0); }
			20% { opacity: 1; }
			30% { opacity: 0; transform: translateY(-20px); }
			100% { opacity: 0; }
		}
	</style>
</head>

<body>
	<div class="wrapper">
		<h1>Takımımız</h1>
		<div class="name-box">
			<div class="name-text">Ziynet</div>
			<div class="name-text">Bertay</div>
			<div class="name-text">Fatih</div>
			<div class="name-text">Mert</div>
			<div class="name-text">Arda</div>
		</div>
	</div>
</body>
</html>
